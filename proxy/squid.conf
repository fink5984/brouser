# Squid forward proxy for the managed Android browser.
#
# Design constraints (see /docs/architecture.md):
#  - No TLS interception. HTTPS traffic is only ever relayed as an opaque
#    CONNECT tunnel; Squid never sees plaintext HTTPS content and never
#    presents its own certificate. WebView performs TLS directly with the
#    destination server end to end.
#  - Every request must be authenticated. This is not an open proxy.
#  - SSRF hardening: requests to loopback, private, link-local and other
#    non-routable destinations are denied by default, closing off access to
#    localhost, internal Docker networks and the cloud metadata endpoint
#    (169.254.169.254) via the proxy.

# ---------------------------------------------------------------------------
# Authentication
# ---------------------------------------------------------------------------
# Per-device credentials are minted by the backend at registration time and
# validated here against the backend's internal API on every new auth
# attempt. Successful results are cached by Squid for authenticate_ttl so we
# are not making an HTTP call to the backend for every single request.
auth_param basic program /usr/local/bin/proxy-auth-helper.py
auth_param basic children 10 startup=3 idle=2
auth_param basic realm Managed Browser Proxy
auth_param basic credentialsttl 5 minutes
auth_param basic casesensitive on

acl authenticated proxy_auth REQUIRED

# ---------------------------------------------------------------------------
# SSRF / internal network protection
# ---------------------------------------------------------------------------
# `acl ... dst` forces Squid to resolve the destination hostname before
# matching, so this also blocks DNS-rebinding attempts that resolve a
# public-looking hostname to a private address.
acl blocked_dst_ipv4 dst 127.0.0.0/8
acl blocked_dst_ipv4 dst 10.0.0.0/8
acl blocked_dst_ipv4 dst 172.16.0.0/12
acl blocked_dst_ipv4 dst 192.168.0.0/16
acl blocked_dst_ipv4 dst 169.254.0.0/16
acl blocked_dst_ipv4 dst 0.0.0.0/8
acl blocked_dst_ipv6 dst ::1/128
acl blocked_dst_ipv6 dst fc00::/7
acl blocked_dst_ipv6 dst fe80::/10

acl metadata_endpoint dst 169.254.169.254/32

acl safe_ports port 80
acl safe_ports port 443
acl connect_method method CONNECT
acl ssl_ports port 443

# ---------------------------------------------------------------------------
# Rate limiting / abuse protection
# ---------------------------------------------------------------------------
# Cap simultaneous connections from a single authenticated client so a
# single compromised or buggy device cannot exhaust proxy resources.
acl per_client_conn_limit maxconn 32

# ---------------------------------------------------------------------------
# Access rules (evaluated top to bottom, first match wins)
# ---------------------------------------------------------------------------
http_access deny !safe_ports
http_access deny connect_method !ssl_ports

http_access deny blocked_dst_ipv4
http_access deny blocked_dst_ipv6
http_access deny metadata_endpoint

http_access deny !authenticated
http_access deny per_client_conn_limit

http_access allow authenticated
http_access deny all

# ---------------------------------------------------------------------------
# HTTPS handling: CONNECT tunnel only, never intercept/terminate TLS.
# ---------------------------------------------------------------------------
ssl_bump none all

# ---------------------------------------------------------------------------
# Networking / performance
# ---------------------------------------------------------------------------
# 3128: plain proxy port, only reachable on the Docker-internal network
#       (not published to the host) plus used for local development.
# 3129: TLS-secured proxy port (androidx.webkit ProxyConfig "https" scheme,
#       i.e. the device opens a TLS connection to the proxy itself before
#       speaking the HTTP proxy / CONNECT protocol inside it). This is the
#       port that should be published publicly in production. The
#       certificate is provided by docker-entrypoint.sh: a real cert+key
#       mounted from the host takes precedence, otherwise a self-signed
#       development certificate is generated on startup.
http_port 3128
https_port 3129 cert=/etc/squid/certs/proxy.pem key=/etc/squid/certs/proxy.key
visible_hostname managed-browser-proxy

# Running as a non-root user (see Dockerfile), so the pid file must live
# somewhere that user owns -- the default /run/squid.pid is root-only.
pid_filename /var/spool/squid/squid.pid

positive_dns_ttl 6 hours
negative_dns_ttl 30 seconds

connect_timeout 15 seconds
peer_connect_timeout 10 seconds
read_timeout 5 minutes
request_timeout 1 minute
client_lifetime 1 day
half_closed_clients off

client_persistent_connections on
server_persistent_connections on
persistent_request_timeout 1 minute

# No disk/memory caching of (potentially private) response bodies.
cache deny all
cache_mem 0 MB
maximum_object_size 0 KB

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
# Includes the authenticated proxy username so usage can be attributed to a
# device, but never logs request bodies, response bodies, or headers.
logformat combined_auth %>a %>eui %ui %un [%tl] "%rm %ru HTTP/%rv" %Hs %<st "%{Referer}>h" "%{User-Agent}>h" %Ss:%Sh
# Logs to stdout/stderr rather than internal files: on Docker/Railway the
# container filesystem is ephemeral and there's no way to read a file
# inside it, so this is what actually makes logs visible in `docker logs`
# / the Railway dashboard.
access_log stdio:/dev/stdout combined_auth
cache_log /dev/stdout
cache_store_log none

# Never log Proxy-Authorization / credentials.
strip_query_terms off
